{% extends "base.html" %}
{% block title %}Редактировать шаблон{% endblock %}

{% block content %}
<div class="template-container">
    <div class="catalog-header-box" style="margin-bottom: 30px;">
        <h1><i class="fas fa-plus-circle"></i> РЕДАКТИРОВАНИЕ <span>ШАБЛОНА</span></h1>
    </div>

    <form action="/web/templates/edit/{{ template.id }}" method="post">
        <div class="template-grid">
            
            <div class="form-card">
                <h3 class="card-title"><i class="fas fa-cog"></i> Настройки</h3>
                
                <div class="form-group">
                    <label>Название шаблона</label>
                    <input type="text" name="name" class="input-styled" placeholder="Напр: День Спины" value="{{ template.name }}" required>
                </div>

                <div class="form-group">
                    <label>Категория тренировки</label>
                    <select name="category" class="input-styled">
                        {% for cat in categories %}<option value="{{ cat }}" {% if cat == template.category %}selected{% endif %}>{{ cat }}</option>{% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Краткое описание</label>
                    <textarea name="description" class="input-styled" rows="4" placeholder="Заметки по темпу или отдыху...">{{ template.description or '' }}</textarea>
                </div>

                <label class="checkbox-wrapper">
                    <input type="checkbox" name="is_public" value="1" {% if template.is_public %}checked{% endif %}>
                    <span class="checkbox-label">Опубликовать для всех</span>
                </label>
            </div>

            <div class="form-card">
                <h3 class="card-title"><i class="fas fa-dumbbell"></i> Состав тренировки</h3>
                
                <div id="exercise-list">
                    {% for cur_ex in current_exercises %}
                    <div class="exercise-item">
                        <div class="exercise-item-header">
                            <span class="exercise-num">Упражнение {{ loop.index }}</span>
                            <button type="button" class="btn-remove-ex" onclick="removeRow(this)"><i class="fas fa-trash"></i></button>
                        </div>
                        <div class="exercise-inputs">
                            <div class="stepper-container">
                                <span class="stepper-label">Название</span>
                                <select name="exercise_ids" class="input-styled ex-select" required>
                                    {% for ex in all_exercises %}<option value="{{ ex.id }}" {% if ex.id == cur_ex.exercise_id %}selected{% endif %}>{{ ex.name }}</option>{% endfor %}
                                </select>
                            </div>
                            <div class="stepper-container">
                                <span class="stepper-label">Подходы</span>
                                <div class="stepper">
                                    <button type="button" onclick="step(this, -1)">-</button>
                                    <input type="number" name="sets" value="{{ cur_ex.sets }}" min="1">
                                    <button type="button" onclick="step(this, 1)">+</button>
                                </div>
                            </div>
                            <div class="stepper-container">
                                <span class="stepper-label">Повторения</span>
                                <div class="stepper">
                                    <button type="button" onclick="step(this, -1)">-</button>
                                    <input type="number" name="reps" value="{{ cur_ex.reps }}" min="1">
                                    <button type="button" onclick="step(this, 1)">+</button>
                                </div>
                            </div>
                            <div class="stepper-container">
                                <span class="stepper-label">Вес (кг)</span>
                                <div class="stepper">
                                    <button type="button" onclick="step(this, -2.5)">-</button>
                                    <input type="number" step="0.5" name="weights" value="{{ cur_ex.weight or 0 }}">
                                    <button type="button" onclick="step(this, 2.5)">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <button type="button" class="btn-add-exercise" onclick="addExerciseRow()">
                    <i class="fas fa-plus-circle"></i> Добавить упражнение
                </button>
            </div>
        </div>

        <div class="form-actions">
            <a href="/web/templates?view=my" class="btn-cancel-text">Отмена</a>
            <button type="submit" class="btn-save-main">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
        </div>
    </form>
</div>

<template id="exercise-template">
    <div class="exercise-item">
        <div class="exercise-item-header">
            <span class="exercise-num">Упражнение 1</span>
            <button type="button" class="btn-remove-ex" onclick="removeRow(this)">
                <i class="fas fa-trash"></i>
            </button>
        </div>
        
        <div class="exercise-inputs">
            <div class="stepper-container">
                <span class="stepper-label-name">Название</span>
                <select name="exercise_ids" class="input-styled ex-select" required>
                    {% for ex in all_exercises %}
                    <option value="{{ ex.id }}">{{ ex.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="stepper-container">
                <span class="stepper-label">Подходы</span>
                <div class="stepper">
                    <button type="button" onclick="step(this, -1)">-</button>
                    <input type="number" name="sets" value="3" min="1" required>
                    <button type="button" onclick="step(this, 1)">+</button>
                </div>
            </div>

            <div class="stepper-container">
                <span class="stepper-label">Повторения</span>
                <div class="stepper">
                    <button type="button" onclick="step(this, -1)">-</button>
                    <input type="number" name="reps" value="12" min="1" required>
                    <button type="button" onclick="step(this, 1)">+</button>
                </div>
            </div>

            <div class="stepper-container">
                <span class="stepper-label">Вес (кг)</span>
                <div class="stepper">
                    <button type="button" onclick="step(this, -2.5)">-</button>
                    <input type="number" step="0.5" name="weights" value="0" required>
                    <button type="button" onclick="step(this, 2.5)">+</button>
                </div>
            </div>
        </div>
    </div>
</template>

<script>
    function step(btn, val) {
        const input = btn.parentElement.querySelector('input');
        const newValue = parseFloat(input.value || 0) + val;
        if (newValue >= (input.min || 0)) { input.value = newValue; }
    }
    function updateNumbers() {
        document.querySelectorAll('.exercise-num').forEach((el, index) => { el.innerText = 'Упражнение ' + (index + 1); });
    }
    function addExerciseRow() {
        const template = document.getElementById('exercise-template');
        const clone = template.content.cloneNode(true);
        document.getElementById('exercise-list').appendChild(clone);
        updateNumbers();
    }
    // управление списокм упражнений в редакторе
    function removeRow(btn) {
        // Находим ближайшего родителя, который является карточкой упражнения
        const row = btn.closest('.exercise-item');
        
        if (row) {
            row.remove();
            updateNumbers();
        } else {
            console.error("Не удалось найти родительский элемент .exercise-item");
        }
    }
    window.onload = function() {
        const currentCount = document.querySelectorAll('#exercise-list .exercise-item').length;
        if (currentCount === 0) {
            addExerciseRow();
        }
    };
</script>
{% endblock %}
